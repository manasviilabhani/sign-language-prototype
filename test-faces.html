<!doctype html>
<html><head><meta charset="utf-8"><title>Face sheet</title>
<style>body{margin:0;background:#fff;font:12px system-ui;color:#111}
.grid{display:flex;flex-wrap:wrap;gap:2px;padding:8px}
.c{text-align:center}canvas{display:block;background:#fafafa;border:1px solid #eee}
.l{font-weight:700;padding:2px}</style></head><body>
<div class="grid" id="g"></div>
<script src="signs.js"></script><script src="face.js"></script><script src="hand.js"></script>
<script>
const C = window.SLPlayer.palette();
for(const n of Object.keys(window.SLFace.FACES)){
  const c=document.createElement('div');c.className='c';
  const l=document.createElement('div');l.className='l';l.textContent=n;
  const cv=document.createElement('canvas');cv.width=150;cv.height=170;
  c.appendChild(l);c.appendChild(cv);document.getElementById('g').appendChild(c);
  const x=cv.getContext('2d');x.scale(0.62,0.62);x.translate(-80,-10);
  window.SLFace.drawAvatar(x,C,window.SLFace.FACES[n],0);
}
</script></body></html>
